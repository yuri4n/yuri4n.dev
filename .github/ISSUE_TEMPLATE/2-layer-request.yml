name: Layer request
description: Add or change something in a yuri4n.dev package.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Owner rule: code moves into yuri4n.dev when a second app needs it. Name both apps below.
  - type: textarea
    id: change
    attributes:
      label: What to add or change
      description: Describe the change and the problem that it solves.
    validations:
      required: true
  - type: textarea
    id: second-use
    attributes:
      label: Second use
      description: Which two apps need this? Link the code in each.
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Proposed package
      options:
        - '@yuri4n/nuxt-base'
        - '@yuri4n/nuxt-ui'
        - '@yuri4n/nuxt-content'
        - '@yuri4n/nuxt-docs'
        - '@yuri4n/nuxt-docs-exdoc'
        - '@yuri4n/eslint-config'
        - Reusable workflows
        - Renovate preset
        - A new package
  - type: dropdown
    id: breaking
    attributes:
      label: Breaking change
      description: Must apps change their code or config to take this change?
      options:
        - No, apps keep working without changes
        - Yes, apps must change
      default: 0
