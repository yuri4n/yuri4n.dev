# Reusable deploy to Vercel with the CLI (vercel pull/build/deploy --prebuilt).
# The default publisher of an app is the Vercel Git integration. This workflow
# is the alternative: the app's ci.yml calls it after the proof passes on main,
# only when the repository variable DEPLOY_FROM_CI is 'true'. Then the app's
# vercel.json turns the Git integration off ("git": {"deploymentEnabled":
# false}). Never let both publish.
#
# The app declares the CLI: `pnpm add -D -E vercel@<version>`. So the app's
# lockfile, its pnpm supply-chain settings (release age, trust policy) and
# Renovate all cover the CLI. (`pnpm dlx` would skip all of them.)
#
# Call it with a tag, never with @main:
#   uses: yuri4n/yuri4n.dev/.github/workflows/vercel-deploy.yml@v0.1.0
#
# The owner creates the secrets. `vercel build` runs the build with the vercel
# preset; the CI proof uses `nitro-preset: vercel`, so both build the same
# thing. `vercel pull` writes the project environment to .vercel/.env.*.local,
# which can hold a real VERCEL_OIDC_TOKEN: a Docus site deployed this way
# depends on `docus.assistant.enabled: false` (docs-ci checks it).
name: Vercel deploy

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      working-directory:
        type: string
        default: .
      # For example vendor/yuri4n.dev. Empty: no library checkout.
      library-path:
        type: string
        default: ''
      library-repository:
        type: string
        default: yuri4n/yuri4n.dev
      # production or preview
      environment:
        type: string
        default: production
      # A hung build or upload stops here, not after 6 hours.
      timeout-minutes:
        type: number
        default: 30
    secrets:
      # Optional. A read-only PAT (Contents read), only for a private library.
      SUBMODULES_TOKEN:
        required: false
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # One deploy at a time per repository and target; never cancel one.
    concurrency:
      group: vercel-deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      TARGET: ${{ inputs.environment }}
    steps:
      - name: Check out the app
        uses: actions/checkout@v7
        with:
          # github.token only; submodules stay empty.
          persist-credentials: false
      - name: Find the library commit
        id: library
        if: inputs.library-path != ''
        working-directory: .
        env:
          LIBRARY_PATH: ${{ inputs.library-path }}
        # The gitlink (mode 160000) is the library commit that the app pins.
        # The sha is assigned on its own line, so a failed rev-parse stops the
        # step (bash -e) instead of writing a bad value.
        run: |
          path="${LIBRARY_PATH%/}"
          mode="$(git ls-files -s -- "$path" | awk 'NR == 1 { print $1 }')"
          if [ "$mode" != 160000 ]; then
            echo "::error::$path is not a git submodule: run pnpm init:app, see README"
            exit 1
          fi
          sha="$(git rev-parse --verify "HEAD:$path")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out the library
        if: inputs.library-path != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.library-repository }}
          ref: ${{ steps.library.outputs.sha }}
          path: ${{ inputs.library-path }}
          # github.token is enough for a public library.
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check the Vercel CLI
        run: |
          if ! pnpm exec vercel --version; then
            echo "::error::The app has no vercel CLI. Run pnpm add -D -E vercel@<version> in the app and commit package.json and pnpm-lock.yaml."
            exit 1
          fi
      - name: Pull the Vercel project settings
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm exec vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"
      - name: Build and deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          PROD=""; [ "$TARGET" = production ] && PROD="--prod"
          pnpm exec vercel build $PROD --token="$VERCEL_TOKEN"
          pnpm exec vercel deploy --prebuilt $PROD --token="$VERCEL_TOKEN"
