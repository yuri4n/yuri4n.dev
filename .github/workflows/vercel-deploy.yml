# Reusable deploy to Vercel with the CLI (vercel pull/build/deploy --prebuilt).
# It is the one publisher of an app while the library is private: Vercel's Git
# integration cannot clone a private submodule. The app's ci.yml calls it after
# the proof passes on main, only when the repository variable
# DEPLOY_FROM_CI is 'true'. Never let the Git integration publish too.
#
# Call it with a tag, never with @main:
#   uses: yuri4n/yuri4n.dev/.github/workflows/vercel-deploy.yml@v0.1.0
#
# The owner creates the secrets. `vercel build` runs the build with the vercel
# preset; the CI proof uses `nitro-preset: vercel`, so both build the same
# thing. `vercel pull` writes the project environment to .vercel/.env.*.local,
# which can hold a real VERCEL_OIDC_TOKEN: a Docus site deployed this way
# depends on `docus.assistant.enabled: false` (docs-ci checks it).
name: Vercel deploy

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      working-directory:
        type: string
        default: .
      # For example vendor/yuri4n.dev. Empty: no library checkout.
      library-path:
        type: string
        default: ''
      library-repository:
        type: string
        default: yuri4n/yuri4n.dev
      # production or preview
      environment:
        type: string
        default: production
      # Exact version of the vercel CLI (pnpm dlx). Renovate does not see it.
      vercel-version:
        type: string
        default: 63.1.0
    secrets:
      SUBMODULES_TOKEN:
        required: false
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # One deploy at a time per repository and target; never cancel one.
    concurrency:
      group: vercel-deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      VERCEL_VERSION: ${{ inputs.vercel-version }}
      TARGET: ${{ inputs.environment }}
    steps:
      - name: Check out the app
        uses: actions/checkout@v7
        with:
          # github.token only; submodules stay empty.
          persist-credentials: false
      - name: Find the library commit
        id: library
        if: inputs.library-path != ''
        working-directory: .
        env:
          LIBRARY_PATH: ${{ inputs.library-path }}
        # The gitlink (mode 160000) is the library commit that the app pins.
        run: |
          mode="$(git ls-files -s -- "$LIBRARY_PATH" | awk 'NR == 1 { print $1 }')"
          if [ "$mode" != 160000 ]; then
            echo "::error::$LIBRARY_PATH is not a git submodule: run pnpm init:app, see README"
            exit 1
          fi
          echo "sha=$(git rev-parse "HEAD:$LIBRARY_PATH")" >> "$GITHUB_OUTPUT"
      - name: Check out the library
        if: inputs.library-path != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.library-repository }}
          ref: ${{ steps.library.outputs.sha }}
          path: ${{ inputs.library-path }}
          # github.token is enough for a public library.
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Pull the Vercel project settings
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx "vercel@$VERCEL_VERSION" pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"
      - name: Build and deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          PROD=""; [ "$TARGET" = production ] && PROD="--prod"
          pnpm dlx "vercel@$VERCEL_VERSION" build $PROD --token="$VERCEL_TOKEN"
          pnpm dlx "vercel@$VERCEL_VERSION" deploy --prebuilt $PROD --token="$VERCEL_TOKEN"
