# Library CI. It never deploys.
# - ci: the root scripts lint, type-check (ESLint package and both
#   playgrounds), test, and build the app playground.
# - docs: the reusable docs-ci.yml on playground-docs. It builds with a dummy
#   VERCEL_OIDC_TOKEN and fails when the Docus assistant is on, so a Docus
#   update (a Renovate PR) must pass the assistant check here.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A run on main proves the commit that a release tag names: never cancel it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/nuxt-ci.yml
    with:
      # The docs job builds playground-docs.
      build-command: pnpm --filter ./playground run build

  docs:
    uses: ./.github/workflows/docs-ci.yml
    with:
      working-directory: playground-docs
      install-directory: .
